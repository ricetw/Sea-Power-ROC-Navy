[AmmunitionNames]
rocn_rim-66k-2=RIM-66K-2,SM-2MR Block IIIA,SAM/ASuW,Kee Lung-class SAM with midcourse commands and terminal semi-active radar homing. Uses US Navy public SM-2MR family specifications of 708 kg and up to 90 nmi. Unpublished performance remains a vanilla-based gameplay approximation.
rocn_rgm-84l=RGM-84L,Harpoon Block II,ASM/Land Attack,Kee Lung-class ship-launched Harpoon with GPS-aided inertial navigation and active radar homing for ships and fixed coastal installations. Public specifications: 690.8 kg and approximately 124 km range. Inflight retargeting is disabled. Unpublished performance remains a gameplay approximation.
rocn_hf-3=Hsiung Feng III,HF-3,Supersonic ASM,Republic of China Navy Hsiung Feng III supersonic anti-ship missile. This is an independent ammunition entry and does not overwrite RGM-84L Harpoon; gameplay values use the public standard-model 150 km range, Mach 2.5-class speed, and approx. 1.4 t missile mass as the basis with a custom high-poly HF-3 visual model.
rocn_hf-2=Hsiung Feng II,HF-2,Subsonic ASM,Republic of China Navy Hsiung Feng II subsonic anti-ship missile with sea-skimming flight, a solid booster, turbojet cruise propulsion, and a dual-mode terminal seeker. Active radar guidance with stronger countermeasure resistance approximates the RF/IIR seeker in game. The vanilla Harpoon visual is temporary until a custom HF-2 model is completed.

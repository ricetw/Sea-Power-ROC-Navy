[AmmunitionNames]
rocn_rim-66k-2=RIM-66K-2,標準二型中程 Block IIIA,面對空/反水面,基隆級使用的標準二型中程防空飛彈，採中途指令修正與終端半主動雷達導引。依美國海軍中程系列公開規格設定重量 708 公斤及最大射程 90 浬；未公開性能採原版遊戲近似。
rocn_rgm-84l=RGM-84L,魚叉 Block II,反艦/對地飛彈,基隆級使用的艦射魚叉 Block II，採 GPS 輔助慣性導航及主動雷達導引，可攻擊艦艇與固定岸上設施。依公開規格設定重量 690.8 公斤及約 124 公里射程；未公開性能為遊戲近似，未加入飛行中重新指定目標能力。
rocn_hf-3=雄風三型,HF-3,超音速反艦飛彈,中華民國國造雄風三型超音速反艦飛彈。
rocn_hf-2=雄風二型,HF-2,次音速反艦飛彈,中華民國國造雄風二型次音速反艦飛彈，具掠海飛行、固態加力器、渦輪噴射巡航與複式終端尋標能力。
